<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Convert your monthly salary to an hourly wage using your weekly or monthly working hours."
    />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Hourly Wage Calculator</title>
    <script>
      try {
        const t = localStorage.getItem('theme');
        const dark = t
          ? t === 'dark'
          : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
        const preferences = localStorage.getItem('calculator-preferences');
        const language = preferences ? JSON.parse(preferences).language : null;
        document.documentElement.lang =
          language === 'fi' ||
          (!language && navigator.language.toLowerCase().startsWith('fi'))
            ? 'fi'
            : 'en';
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
